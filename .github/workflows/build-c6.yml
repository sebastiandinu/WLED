name: Build C6
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install platformio esptool
      - name: XIAO override
        run: |
          cat > platformio_override.ini << 'EOF'
          [env:xiao_c6]
          extends = env:esp32c6dev_4MB
          build_flags = ${env:esp32c6dev_4MB.build_flags}
            -DARDUINO_USB_CDC_ON_BOOT=1
          EOF
      - run: pio run -e xiao_c6
      - name: Collect flash files
        run: |
          mkdir out
          cd .pio/build/xiao_c6
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -n1)
          cp bootloader.bin partitions.bin firmware.bin ../../../out/
          cp "$BOOT" ../../../out/boot_app0.bin
          python -m esptool --chip esp32c6 merge_bin -o ../../../out/c6-factory.bin --flash_size 4MB 0x0 bootloader.bin 0x8000 partitions.bin 0xe000 "$BOOT" 0x10000 firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: wled-xiao-c6
          path: out/
